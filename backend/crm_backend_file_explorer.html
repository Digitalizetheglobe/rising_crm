let open = new Set([0]);
let active = -1;

function toggle(i) {
  if (FILES[i].d) {
    if (open.has(i)) open.delete(i); else open.add(i);
    render();
  } else {
    active = i;
    render();
    showDetail(FILES[i]);
  }
}

function isVisible(i) {
  if (i === 0) return true;
  let level = FILES[i].l;
  for (let j = i-1; j >= 0; j--) {
    if (FILES[j].l < level) {
      if (!FILES[j].d || !open.has(j)) return false;
      level = FILES[j].l;
      if (level === 0) return true;
    }
  }
  return true;
}

function render() {
  const tree = document.getElementById('tree');
  tree.innerHTML = FILES.map((f, i) => {
    if (!isVisible(i)) return '';
    const isDir = f.d;
    const isOpen = isDir && open.has(i);
    const indentClass = 'indent' + f.l;
    const activeClass = !isDir && i === active ? ' active' : '';
    const toggle = isDir ? `<span class="toggle">${isOpen ? '▾' : '▸'}</span>` : '<span class="toggle"> </span>';
    const icon = isDir ? '<span class="icon folder-icon">⬡</span>' : '<span class="icon file-icon">·</span>';
    const nameClass = isDir ? 'fname isdir' : 'fname';
    return `<div class="row ${indentClass}${activeClass}" onclick="toggle(${i})">${toggle}${icon}<span class="${nameClass}">${f.n}</span></div>`;
  }).join('');
}

function showDetail(f) {
  const detail = document.getElementById('detail');
  const exportsHtml = f.exports && f.exports.length
    ? `<div class="detail-exports"><div class="label">Exports</div>${f.exports.map(e => `<span class="chip">${e}</span>`).join('')}</div>`
    : '';
  detail.innerHTML = `
    <div class="detail-title">${f.n}</div>
    <div class="detail-path">${f.n}</div>
    <div class="detail-desc">${f.desc || ''}</div>
    ${exportsHtml}
  `;
}

render();
</script>
